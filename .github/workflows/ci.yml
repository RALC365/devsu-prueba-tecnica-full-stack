name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build y pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-cobertura
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run typecheck

      - name: Pruebas
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-cobertura
          path: frontend/coverage
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build de imágenes
        run: docker compose build

      - name: Levantar servicios
        run: docker compose up -d --wait --wait-timeout 180

      - name: Probar frontend y proxy
        run: |
          curl -fsS http://localhost:4200/ > /dev/null
          curl -fsS http://localhost:4200/api/clientes

      - name: Colección de Postman
        run: npx -y newman@6 run postman/Banco-API.postman_collection.json

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Bajar servicios
        if: always()
        run: docker compose down -v
