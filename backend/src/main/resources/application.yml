spring:
  application:
    name: banco-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/banco}
    username: ${DB_USERNAME:banco}
    password: ${DB_PASSWORD:banco}
    hikari:
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  web:
    locale: es_EC
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha

banco:
  zona-horaria: ${BANCO_ZONA_HORARIA:America/Guayaquil}
  movimientos:
    limite-diario-retiro: ${BANCO_LIMITE_DIARIO_RETIRO:1000}
  cors:
    allowed-origins: ${BANCO_CORS_ORIGENES:http://localhost:4200}
