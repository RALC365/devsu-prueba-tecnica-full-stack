apiVersion: v1
kind: ConfigMap
metadata:
  name: banco-backend
  namespace: banco
data:
  DB_URL: jdbc:postgresql://db:5432/banco
  BANCO_LIMITE_DIARIO_RETIRO: "1000"
  BANCO_ZONA_HORARIA: America/Guayaquil
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: banco
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: banco
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: banco
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: banco
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: banco-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: banco-backend
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: banco-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banco-db
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
